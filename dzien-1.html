<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dzień pierwszy — Kalendarz adwentowy</title>
  <link rel="stylesheet" href="dzien.css">
</head>

<body>
  <canvas id="snow" aria-hidden="true"></canvas>
  <div id="snowGround" aria-hidden="true"></div>

  <audio id="backgroundMusic" loop preload="auto">
    <source src="muzyka-swiateczna.mp3" type="audio/mpeg">
  </audio>

  <section class="intro-screen" id="introScreen">
    <p class="eyebrow">Kalendarz adwentowy</p>
    <h1>Dzień pierwszy</h1>
    <div class="divider" aria-hidden="true"></div>
    <p class="intro-text">Kliknij prezent i znajdź swoją nagrodę</p>

    <button class="first-gift" id="firstGift" type="button" aria-label="Rozpocznij dzień pierwszy">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <ellipse cx="100" cy="171" rx="58" ry="9" fill="#263a2d" opacity=".12"/>
        <path d="M53 91h94v67a8 8 0 0 1-8 8H61a8 8 0 0 1-8-8V91Z" fill="#743b3b"/>
        <path d="M53 91h94v13H53z" fill="#834747"/>
        <path d="M91 91h18v75H91z" fill="#c4a66a"/>
        <path d="M94 91h12v75H94z" fill="#d8bd83"/>
        <path d="M43 78h114v21H43z" fill="#8a4a49"/>
        <path d="M91 78h18v21H91z" fill="#d8bd83"/>
        <path d="M99 79C75 74 72 57 82 55c9-2 16 10 18 24Z" fill="#c4a66a"/>
        <path d="M101 79c24-5 27-22 17-24-9-2-16 10-18 24Z" fill="#d8bd83"/>
        <circle cx="100" cy="78" r="6" fill="#bd9a5b"/>
      </svg>
    </button>
  </section>

  <section class="festive-scene" id="festiveScene" hidden>
    <img class="sleigh" src="sanie-mikolaja.png" alt="" aria-hidden="true">
    <img class="tree" src="choinka.png" alt="" aria-hidden="true">

    <div class="scene-title">
      <p class="eyebrow">Kalendarz adwentowy</p>
      <h2>Dzień pierwszy</h2>
      <p class="scene-hint" id="sceneHint">Kliknij prezent pod choinką</p>
    </div>

    <img class="santa" src="mikolaj.png" alt="" aria-hidden="true">

    <button class="second-gift" id="secondGift" type="button" aria-label="Otwórz drugi prezent">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <ellipse cx="100" cy="174" rx="58" ry="9" fill="#07120d" opacity=".25"/>
        <path d="M50 88h100v76a8 8 0 0 1-8 8H58a8 8 0 0 1-8-8V88Z" fill="#315d46"/>
        <path d="M50 88h100v14H50z" fill="#3c7053"/>
        <path d="M91 88h18v84H91z" fill="#d8bd83"/>
        <path d="M94 88h12v84H94z" fill="#f0d89b"/>
        <g class="lid">
          <path d="M40 72h120v23H40z" fill="#497b5e"/>
          <path d="M91 72h18v23H91z" fill="#f0d89b"/>
          <path d="M99 74C76 68 74 52 84 50c8-2 14 9 16 22Z" fill="#d8bd83"/>
          <path d="M101 74c23-6 25-22 15-24-8-2-14 9-16 22Z" fill="#f0d89b"/>
          <circle cx="100" cy="73" r="6" fill="#bd9a5b"/>
        </g>
      </svg>
    </button>

    <section class="reward" id="reward" aria-live="polite">
      <h3>Mała chwila dla Ciebie</h3>
      <p>
        Znajdź dziś moment na coś, co sprawia Ci radość.
        Niech grudzień zacznie się odrobiną spokoju.
      </p>
    </section>
  </section>

  <a class="back-link" href="index.html">← Wróć do kalendarza</a>

  <script>
    const introScreen = document.querySelector("#introScreen");
    const festiveScene = document.querySelector("#festiveScene");
    const firstGift = document.querySelector("#firstGift");
    const secondGift = document.querySelector("#secondGift");
    const sceneHint = document.querySelector("#sceneHint");
    const reward = document.querySelector("#reward");
    const music = document.querySelector("#backgroundMusic");
    const canvas = document.querySelector("#snow");
    const ctx = canvas.getContext("2d");

    let flakes = [];
    let width = 0;
    let height = 0;
    let snowStarted = false;

    function resizeSnow() {
      const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width * pixelRatio;
      canvas.height = height * pixelRatio;
      ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);

      const count = Math.min(140, Math.floor(width / 8));
      flakes = Array.from({ length: count }, () => ({
        x: Math.random() * width,
        y: Math.random() * height,
        radius: Math.random() * 2.2 + 0.7,
        speed: Math.random() * 0.8 + 0.35,
        drift: Math.random() * 0.6 - 0.3,
        opacity: Math.random() * 0.55 + 0.2
      }));
    }

    function drawSnow() {
      ctx.clearRect(0, 0, width, height);

      for (const flake of flakes) {
        ctx.beginPath();
        ctx.arc(flake.x, flake.y, flake.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 250, 240, ${flake.opacity})`;
        ctx.fill();

        flake.y += flake.speed;
        flake.x += flake.drift;

        if (flake.y > height + 5) {
          flake.y = -5;
          flake.x = Math.random() * width;
        }

        if (flake.x < -5) flake.x = width + 5;
        if (flake.x > width + 5) flake.x = -5;
      }

      requestAnimationFrame(drawSnow);
    }

    firstGift.addEventListener("click", () => {
      document.body.classList.add("festive");
      introScreen.classList.add("leaving");
      music.play().catch(() => {});

      if (!snowStarted) {
        snowStarted = true;
        resizeSnow();
        drawSnow();
        window.addEventListener("resize", resizeSnow);
      }

      window.setTimeout(() => {
        introScreen.hidden = true;
        festiveScene.hidden = false;
        requestAnimationFrame(() => festiveScene.classList.add("visible"));
      }, 350);
    });

    secondGift.addEventListener("click", () => {
      secondGift.classList.add("open");
      secondGift.disabled = true;
      sceneHint.textContent = "Twoja niespodzianka";
      reward.classList.add("visible");
    });
  </script>
</body>
</html>
