<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dzień pierwszy — Kalendarz adwentowy</title>

  <style>
    :root {
      --pine: #14271f;
      --pine-light: #20372c;
      --cream: #f6f0e4;
      --gold: #bd9a5b;
      --burgundy: #743b3b;
      --ink: #27352d;
      --muted: #77776c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 140px 20px 50px;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 18%, #ffffff18 0 1px, transparent 2px),
        radial-gradient(circle at 82% 28%, #ffffff20 0 1px, transparent 2px),
        radial-gradient(circle at 25% 78%, #ffffff15 0 1px, transparent 2px),
        radial-gradient(circle at 88% 82%, #ffffff18 0 1px, transparent 2px),
        linear-gradient(145deg, var(--pine), var(--pine-light));
      background-size: 120px 140px, 170px 180px, 200px 190px, 150px 170px, auto;
    }

    .scene {
      --sleigh-left: 50%;
      --sleigh-top: -130px;
      --sleigh-transform: translateX(-50%);
      --santa-left: calc(50% + 70px);
      --santa-top: 270px;

      position: relative;
      width: min(100%, 900px);
      margin: 0 auto;
    }

    #snow {
      position: fixed;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .sleigh {
      position: absolute;
      z-index: 3;
      top: var(--sleigh-top);
      left: var(--sleigh-left);
      width: min(380px, 80vw);
      height: auto;
      transform: var(--sleigh-transform);
      pointer-events: none;
      animation: sleigh-float 5s ease-in-out infinite;
    }

    main {
      position: relative;
      z-index: 2;
      width: min(100%, 520px);
      margin: 0 auto;
      padding: 54px 38px 34px;
      text-align: center;
      background: var(--cream);
      border: 1px solid #d5c49f;
      box-shadow: 0 28px 80px #07120d70;
    }

    main::before {
      content: "";
      position: absolute;
      inset: 10px;
      border: 1px solid #d8c9aa;
      pointer-events: none;
    }

    .santa {
      position: absolute;
      z-index: 3;
      top: var(--santa-top);
      left: var(--santa-left);
      right: auto;
      width: min(250px, 28vw);
      height: auto;
      pointer-events: none;
      animation: santa-float 4s ease-in-out infinite;
    }

    .eyebrow {
      margin: 0 0 14px;
      color: var(--burgundy);
      font-family: Arial, sans-serif;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.24em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 7vw, 2.8rem);
      font-weight: 400;
      letter-spacing: -0.04em;
    }

    .divider {
      width: 42px;
      height: 1px;
      margin: 24px auto 20px;
      background: var(--gold);
    }

    .hint {
      margin: 0;
      color: var(--muted);
      font-family: Arial, sans-serif;
      font-size: 0.9rem;
      letter-spacing: 0.02em;
    }

    .gift-button {
      position: relative;
      display: grid;
      width: 190px;
      height: 190px;
      margin: 22px auto 12px;
      padding: 0;
      place-items: center;
      border: 0;
      background: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .gift-button svg {
      width: 100%;
      height: 100%;
      overflow: visible;
      filter: drop-shadow(0 12px 10px #392c1b25);
      transition: transform 250ms ease;
    }

    .gift-button:hover svg {
      transform: translateY(-4px);
    }

    .gift-lid {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      transition: transform 700ms cubic-bezier(.2, .8, .2, 1);
    }

    .gift-button.open .gift-lid {
      transform: translate(-10px, -27px) rotate(-13deg);
    }

    .gift-button.open svg {
      animation: gift-glow 700ms ease-out;
    }

    .gift-button:focus-visible {
      outline: 2px solid var(--burgundy);
      outline-offset: 3px;
      border-radius: 50%;
    }

    .gift-button:disabled {
      cursor: default;
    }

    .gift-button:disabled:hover svg {
      transform: none;
    }

    #reward {
      display: none;
      max-width: 350px;
      margin: 20px auto 0;
      animation: reveal 600ms ease both;
    }

    #reward.visible {
      display: block;
    }

    #reward h2 {
      margin: 0 0 10px;
      color: var(--burgundy);
      font-size: 1.5rem;
      font-weight: 400;
    }

    #reward p {
      margin: 0;
      font-size: 1.08rem;
      line-height: 1.7;
    }

    .back-link {
      display: inline-block;
      margin-top: 32px;
      color: var(--pine);
      font-family: Arial, sans-serif;
      font-size: 0.8rem;
      letter-spacing: 0.06em;
      text-decoration: none;
      transition: color 150ms ease;
    }

    .back-link:hover {
      color: var(--burgundy);
    }

    #positionEditor[hidden] {
      display: none;
    }

    #positionEditor {
      position: fixed;
      z-index: 10;
      right: 12px;
      bottom: 12px;
      left: 12px;
      width: min(600px, calc(100% - 24px));
      max-height: 38vh;
      margin: 0 auto;
      overflow: auto;
      padding: 14px;
      border: 1px solid #bd9a5b;
      color: #f6f0e4;
      background: #14271fee;
      box-shadow: 0 8px 30px #0008;
      font-family: Arial, sans-serif;
      text-align: left;
    }

    #positionEditor p {
      margin: 0 0 10px;
      font-size: 14px;
      line-height: 1.4;
    }

    #positionEditor button {
      padding: 8px 12px;
      border: 1px solid #bd9a5b;
      color: #f6f0e4;
      background: #743b3b;
      cursor: pointer;
    }

    #positionCode {
      margin: 10px 0 6px;
      padding: 10px;
      overflow-x: auto;
      color: #f6f0e4;
      background: #07120d;
      font-size: 12px;
      white-space: pre-wrap;
      user-select: all;
    }

    #copyStatus {
      min-height: 16px;
      font-size: 12px;
    }

    body.edit-mode .sleigh,
    body.edit-mode .santa {
      z-index: 5;
      pointer-events: auto;
      cursor: grab;
      touch-action: none;
      outline: 1px dashed #f4d15e;
      animation: none;
    }

    body.edit-mode .sleigh:active,
    body.edit-mode .santa:active {
      cursor: grabbing;
    }

    @keyframes reveal {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes gift-glow {
      50% {
        filter: drop-shadow(0 0 18px #bd9a5b99);
      }
    }

    @keyframes sleigh-float {
      0%, 100% {
        translate: 0 0;
      }

      50% {
        translate: 0 -8px;
      }
    }

    @keyframes santa-float {
      0%, 100% {
        translate: 0 0;
      }

      50% {
        translate: 0 -7px;
      }
    }

    @media (max-width: 760px) {
      body {
        padding-top: 120px;
      }

      .sleigh {
        width: min(300px, 85vw);
      }

      .santa {
        width: min(130px, 32vw);
      }
    }

    @media (max-width: 480px) {
      main {
        padding: 46px 24px 30px;
      }

      .gift-button {
        width: 170px;
        height: 170px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <canvas id="snow" aria-hidden="true"></canvas>

  <audio id="backgroundMusic" loop preload="auto">
    <source src="muzyka-swiateczna.mp3" type="audio/mpeg">
  </audio>

  <div class="scene" id="scene">
    <img
      class="sleigh"
      id="sleigh"
      src="sanie-mikolaja.png"
      alt=""
      aria-hidden="true"
    >

    <main>
      <p class="eyebrow">Kalendarz adwentowy</p>
      <h1>Dzień pierwszy</h1>
      <div class="divider" aria-hidden="true"></div>
      <p class="hint" id="hint">Kliknij prezent, aby odkryć niespodziankę</p>

      <button
        class="gift-button"
        id="giftButton"
        type="button"
        aria-label="Otwórz prezent"
        aria-controls="reward"
      >
        <svg viewBox="0 0 200 200" aria-hidden="true">
          <ellipse cx="100" cy="171" rx="58" ry="9" fill="#263a2d" opacity=".12"/>

          <path d="M53 91h94v67a8 8 0 0 1-8 8H61a8 8 0 0 1-8-8V91Z" fill="#743b3b"/>
          <path d="M53 91h94v13H53z" fill="#834747"/>
          <path d="M91 91h18v75H91z" fill="#c4a66a"/>
          <path d="M94 91h12v75H94z" fill="#d8bd83"/>

          <g class="gift-lid">
            <path d="M43 78h114v21H43z" fill="#8a4a49"/>
            <path d="M91 78h18v21H91z" fill="#d8bd83"/>
            <path d="M99 79C75 74 72 57 82 55c9-2 16 10 18 24Z" fill="#c4a66a"/>
            <path d="M101 79c24-5 27-22 17-24-9-2-16 10-18 24Z" fill="#d8bd83"/>
            <circle cx="100" cy="78" r="6" fill="#bd9a5b"/>
          </g>

          <circle cx="43" cy="53" r="2" fill="#bd9a5b"/>
          <circle cx="158" cy="58" r="2.5" fill="#bd9a5b"/>
          <path d="M35 125h8M39 121v8" stroke="#bd9a5b" stroke-width="1.5"/>
          <path d="M158 126h8M162 122v8" stroke="#bd9a5b" stroke-width="1.5"/>
        </svg>
      </button>

      <section id="reward" aria-live="polite">
        <h2>Mała chwila dla Ciebie</h2>
        <p>
          Znajdź dziś moment na coś, co sprawia Ci radość.
          Niech grudzień zacznie się odrobiną spokoju.
        </p>
      </section>

      <a class="back-link" href="index.html">← Wróć do kalendarza</a>
    </main>

    <img
      class="santa"
      id="santa"
      src="mikolaj.png"
      alt=""
      aria-hidden="true"
    >
  </div>

  <div id="positionEditor" hidden>
    <p><strong>Tryb ustawiania:</strong> przeciągnij sanie i Mikołaja myszką, gdzie chcesz.</p>
    <button id="copyPositions" type="button">Kopiuj pozycje CSS</button>
    <pre id="positionCode"></pre>
    <div id="copyStatus"></div>
  </div>

  <script>
    const giftButton = document.querySelector("#giftButton");
    const reward = document.querySelector("#reward");
    const hint = document.querySelector("#hint");
    const music = document.querySelector("#backgroundMusic");

    giftButton.addEventListener("click", () => {
      giftButton.classList.add("open");
      giftButton.disabled = true;
      giftButton.setAttribute("aria-label", "Prezent otwarty");
      hint.textContent = "Twoja niespodzianka";
      reward.classList.add("visible");
    });

    // Animacja padającego śniegu
    const canvas = document.querySelector("#snow");
    const ctx = canvas.getContext("2d");
    let flakes = [];
    let width = 0;
    let height = 0;

    function resizeSnow() {
      const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;

      canvas.width = width * pixelRatio;
      canvas.height = height * pixelRatio;
      ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);

      const flakeCount = Math.min(140, Math.floor(width / 8));

      flakes = Array.from({ length: flakeCount }, () => ({
        x: Math.random() * width,
        y: Math.random() * height,
        radius: Math.random() * 2.2 + 0.7,
        speed: Math.random() * 0.8 + 0.35,
        drift: Math.random() * 0.6 - 0.3,
        opacity: Math.random() * 0.55 + 0.2
      }));
    }

    function drawSnow() {
      ctx.clearRect(0, 0, width, height);

      for (const flake of flakes) {
        ctx.beginPath();
        ctx.arc(flake.x, flake.y, flake.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 250, 240, ${flake.opacity})`;
        ctx.fill();

        flake.y += flake.speed;
        flake.x += flake.drift;

        if (flake.y > height + 5) {
          flake.y = -5;
          flake.x = Math.random() * width;
        }

        if (flake.x < -5) flake.x = width + 5;
        if (flake.x > width + 5) flake.x = -5;
      }

      requestAnimationFrame(drawSnow);
    }

    resizeSnow();
    drawSnow();
    window.addEventListener("resize", resizeSnow);

    // Muzyka próbuje wystartować po wejściu.
    // Jeśli przeglądarka zablokuje autoplay, ruszy po pierwszym kliknięciu.
    function startMusic() {
      music.play().catch(() => {
        document.addEventListener("click", () => {
          music.play().catch(() => {});
        }, { once: true });
      });
    }

    startMusic();

    // Tryb ustawiania włącza się tylko z adresem ?ustaw=1
    const editMode = new URLSearchParams(window.location.search).get("ustaw") === "1";
    const editor = document.querySelector("#positionEditor");
    const positionCode = document.querySelector("#positionCode");
    const copyStatus = document.querySelector("#copyStatus");
    const scene = document.querySelector("#scene");
    const decorations = [
      document.querySelector("#sleigh"),
      document.querySelector("#santa")
    ];

    function updatePositionCode() {
      const sceneWidth = scene.clientWidth || 1;
      const sleighLeft = parseFloat(decorations[0].style.left) || 0;
      const sleighTop = parseFloat(decorations[0].style.top) || 0;
      const santaLeft = parseFloat(decorations[1].style.left) || 0;
      const santaTop = parseFloat(decorations[1].style.top) || 0;

      positionCode.textContent =
`.scene {
  --sleigh-left: ${(sleighLeft / sceneWidth * 100).toFixed(1)}%;
  --sleigh-top: ${Math.round(sleighTop)}px;
  --sleigh-transform: none;
  --santa-left: ${(santaLeft / sceneWidth * 100).toFixed(1)}%;
  --santa-top: ${Math.round(santaTop)}px;
}`;
    }

    if (editMode) {
      document.body.classList.add("edit-mode");
      editor.hidden = false;

      requestAnimationFrame(() => {
        const sceneRect = scene.getBoundingClientRect();

        for (const image of decorations) {
          const imageRect = image.getBoundingClientRect();
          const left = imageRect.left - sceneRect.left;
          const top = imageRect.top - sceneRect.top;

          image.style.left = `${left}px`;
          image.style.top = `${top}px`;
          image.style.right = "auto";
          image.style.transform = "none";
        }

        updatePositionCode();
      });

      let draggedImage = null;
      let startX = 0;
      let startY = 0;
      let originalLeft = 0;
      let originalTop = 0;

      for (const image of decorations) {
        image.addEventListener("pointerdown", (event) => {
          event.preventDefault();
          draggedImage = image;
          startX = event.clientX;
          startY = event.clientY;
          originalLeft = parseFloat(image.style.left) || 0;
          originalTop = parseFloat(image.style.top) || 0;
          image.setPointerCapture(event.pointerId);
        });

        image.addEventListener("pointermove", (event) => {
          if (draggedImage !== image) return;

          const left = originalLeft + event.clientX - startX;
          const top = originalTop + event.clientY - startY;

          image.style.left = `${left}px`;
          image.style.top = `${top}px`;
          updatePositionCode();
        });

        image.addEventListener("pointerup", () => {
          if (draggedImage === image) draggedImage = null;
        });

        image.addEventListener("pointercancel", () => {
          if (draggedImage === image) draggedImage = null;
        });
      }

      document.querySelector("#copyPositions").addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(positionCode.textContent);
          copyStatus.textContent = "Pozycje skopiowane. Wklej je do reguły .scene w CSS.";
        } catch {
          copyStatus.textContent = "Zaznacz kod powyżej i skopiuj go ręcznie.";
        }
      });
    }
  </script>
</body>
</html>
