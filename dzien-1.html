<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dzień 1 — Kalendarz adwentowy</title>

  <style>
    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      display: grid;
      place-items: center;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
      text-align: center;
      color: #fff;
      background: linear-gradient(135deg, #123b2a, #176044);
    }

    main {
      width: min(100%, 500px);
      padding: 36px 24px;
      box-sizing: border-box;
      border: 2px solid #f4d58d;
      border-radius: 20px;
      background: #fff6dd;
      color: #382710;
      box-shadow: 0 12px 30px #0003;
    }

    .emoji {
      font-size: 4rem;
    }

    a {
      display: inline-block;
      margin-top: 18px;
      padding: 12px 20px;
      border-radius: 10px;
      color: #fff;
      background: #b3313b;
      text-decoration: none;
      font-weight: bold;
    }

    a:hover {
      background: #912630;
    }
  </style>
</head>

<body>
  <main>
    <div class="emoji">🎁</div>
    <h1>Dzień 1</h1>
    <p>Twoja pierwsza nagroda: dziś znajdź chwilę na coś, co sprawia Ci radość. Miłego początku! 😊</p>
    <a href="index.html">← Wróć do kalendarza</a>
  </main>
</body>
</html>
